[project]
name = "pressella-pitch-guardrail"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live LLM integration tests (excluded from CI unit test runs)"
]

